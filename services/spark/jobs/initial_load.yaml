# Initial load: CSV on HDFS -> Avro on HDFS via Spark.
# HDFS_URL, SPARK_MASTER_URL etc. come from the spark-integration ConfigMap.
apiVersion: batch/v1
kind: Job
metadata: {name: initial-load}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: driver
          image: ${IMAGE}
          envFrom: [{configMapRef: {name: spark-integration}}]
          env:
            - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: HADOOP_USER_NAME, value: root}
            - {name: RESTAURANTS, value: "restaurant-1,restaurant-2"}
            - {name: LANDING, value: /landing}
          args: ["/bin/sh", "-c", 'exec spark-submit --master "$SPARK_MASTER_URL" --packages org.apache.spark:spark-avro_2.12:3.5.2 --conf spark.driver.host=$POD_IP --conf spark.driver.bindAddress=0.0.0.0 --conf spark.driver.port=29000 --conf spark.blockManager.port=29001 --conf spark.cores.max=2 --conf spark.executor.cores=1 --conf spark.executor.memory=1g --conf spark.jars.ivy=/tmp/.ivy2 /opt/app/initial_load.py']
          volumeMounts: [{name: app, mountPath: /opt/app}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
      volumes: [{name: app, configMap: {name: spark-app}}]
