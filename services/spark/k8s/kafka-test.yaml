# Send a test forecast / look at a topic:
#   CHECK_MODE=send CHECK_TARGET=weather-predictions-london                ./deploy.sh k8s/kafka-test.yaml
#   CHECK_MODE=send CHECK_TARGET=weather-predictions-london CHECK_ARGS="0 3" ./deploy.sh k8s/kafka-test.yaml   (start today, 3 days)
#   CHECK_MODE=show CHECK_TARGET=predictions                               ./deploy.sh k8s/kafka-test.yaml
# then: kubectl logs -n bd-gr-06 job/kafka-test
apiVersion: batch/v1
kind: Job
metadata: {name: kafka-test}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: driver
          image: ${IMAGE}
          envFrom: [{configMapRef: {name: spark-integration}}]
          env: [{name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}]
          args: ["/bin/sh", "-c", 'exec spark-submit --master "$SPARK_MASTER_URL" --conf spark.driver.host=$POD_IP --conf spark.driver.bindAddress=0.0.0.0 --conf spark.driver.port=29000 --conf spark.blockManager.port=29001 --conf spark.cores.max=1 --conf spark.executor.cores=1 --driver-memory 768m --conf spark.executor.memory=1g --conf spark.jars.ivy=/tmp/.ivy2 --conf spark.sql.shuffle.partitions=4 --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.2,org.apache.spark:spark-avro_2.12:3.5.2 /opt/app/kafka_test.py ${CHECK_MODE} ${CHECK_TARGET} ${CHECK_ARGS}']
          volumeMounts: [{name: app, mountPath: /opt/app}, {name: schemas, mountPath: /opt/schemas}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 2Gi}}
      volumes:
        - {name: app, configMap: {name: spark-app}}
        - {name: schemas, configMap: {name: spark-schemas}}
